<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Whiteboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar { width: 260px; }
        .tool-btn { transition: all 0.2s ease-in-out; }
        .tool-btn.active { background-color: #e0f2fe; color: #0284c7; }
        .tool-btn:hover { background-color: #f0f9ff; }
        canvas { cursor: crosshair; }
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px;
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s, bottom 0.5s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="sidebar bg-white shadow-lg p-4 flex flex-col gap-6">
        <h1 class="text-xl font-bold text-gray-800 text-center">Collaborative Whiteboard</h1>
        
        <!-- Tools Section -->
        <div>
            <h2 class="text-sm font-semibold text-gray-500 mb-2 px-2">TOOLS</h2>
            <div class="flex flex-col gap-1">
                <button id="pen-tool" class="tool-btn w-full text-left flex items-center gap-3 p-2 rounded-lg active" data-tool="pen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                    Pen
                </button>
                <button id="select-tool" class="tool-btn w-full text-left flex items-center gap-3 p-2 rounded-lg" data-tool="select">
                   <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                    Select
                </button>
                <button id="eraser-tool" class="tool-btn w-full text-left flex items-center gap-3 p-2 rounded-lg" data-tool="eraser">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21H7Z"/><path d="M22 22H2"/></svg>
                    Eraser
                </button>
            </div>
        </div>

        <!-- Shapes Section -->
        <div>
            <h2 class="text-sm font-semibold text-gray-500 mb-2 px-2">SHAPES</h2>
            <div class="flex flex-col gap-1">
                <button id="rectangle-tool" class="tool-btn w-full text-left flex items-center gap-3 p-2 rounded-lg" data-tool="rectangle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" x="3" y="6" rx="2"/></svg>
                    Rectangle
                </button>
                <button id="circle-tool" class="tool-btn w-full text-left flex items-center gap-3 p-2 rounded-lg" data-tool="circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
                    Circle
                </button>
            </div>
        </div>

        <!-- Settings Section -->
        <div class="border-t pt-4">
            <h2 class="text-sm font-semibold text-gray-500 mb-2 px-2">SETTINGS</h2>
            <div class="px-2">
                <label for="color-picker" class="block text-sm font-medium text-gray-700">Color</label>
                <input type="color" id="color-picker" value="#000000" class="mt-1 block w-full h-8 p-0 border-none cursor-pointer rounded-md">
            </div>
            <div class="mt-4 px-2">
                <label for="width-slider" class="block text-sm font-medium text-gray-700">Width</label>
                <input type="range" id="width-slider" min="1" max="50" value="5" class="mt-1 block w-full">
            </div>
        </div>

        <!-- Actions Section -->
        <div class="border-t pt-4 mt-auto">
             <h2 class="text-sm font-semibold text-gray-500 mb-2 px-2">ACTIONS</h2>
            <button id="clear-canvas" class="tool-btn w-full text-left flex items-center gap-3 p-2 rounded-lg text-red-600 hover:bg-red-50">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                Clear All
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 bg-gray-200 p-4">
        <canvas id="whiteboard" class="w-full h-full bg-white rounded-lg shadow-inner"></canvas>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('whiteboard');
            const ctx = canvas.getContext('2d');

            // --- STATE MANAGEMENT ---
            const state = {
                currentTool: 'pen',
                strokeColor: '#000000',
                lineWidth: 5,
                isDrawing: false,
                startX: 0,
                startY: 0,
                snapshot: null,
                selectedObject: null,
                isDragging: false,
                offsetX: 0,
                offsetY: 0
            };

            let commandHistory = [];
            
            // --- WEBSOCKET COMMUNICATION ---
            let stompClient = null;
            let sessionId = new URLSearchParams(window.location.search).get('sessionId') || `session-${Date.now()}`;
            const serverUrl = 'http://localhost:8080/ws';
            let reconnectInterval;

            function showToast(message, duration = 3000) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = "toast show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, duration);
            }

            function connect() {
                console.log("Attempting to connect...");
                const socket = new SockJS(serverUrl);
                stompClient = Stomp.over(socket);

                stompClient.connect({}, (frame) => {
                    console.log('Connected: ' + frame);
                    showToast('Connected to session: ' + sessionId);
                    if (reconnectInterval) clearInterval(reconnectInterval);

                    stompClient.subscribe(`/topic/whiteboard/${sessionId}`, (message) => {
                        const command = JSON.parse(message.body);
                        if(command.type === 'CLEAR') {
                            commandHistory = [];
                        } else {
                            const commandObject = createCommandObject(command);
                            if (commandObject) commandHistory.push(commandObject);
                        }
                        renderCanvas();
                    });

                    stompClient.subscribe(`/user/topic/whiteboard/${sessionId}/history`, (message) => {
                        const history = JSON.parse(message.body);
                        commandHistory = history.map(cmd => createCommandObject(cmd)).filter(Boolean);
                        renderCanvas();
                    });

                    stompClient.send(`/app/whiteboard/${sessionId}/history`, {}, '');
                }, (error) => {
                    console.error('Connection error:', error);
                    showToast('Connection error. Retrying...');
                    scheduleReconnect();
                });

                socket.onclose = () => {
                    console.log("Socket closed. Attempting to reconnect...");
                    showToast("Connection lost. Retrying...");
                    scheduleReconnect();
                };
            }
            
            function scheduleReconnect() {
                if(reconnectInterval) clearInterval(reconnectInterval);
                reconnectInterval = setInterval(() => {
                    if (!stompClient || !stompClient.connected) {
                         connect();
                    }
                }, 5000);
            }

            function sendCommand(command) {
                // DEBUGGING LOG ADDED HERE
                console.log("Sending command:", JSON.stringify(command, null, 2));

                if (stompClient && stompClient.connected) {
                    stompClient.send(`/app/whiteboard/${sessionId}`, {}, JSON.stringify(command));
                } else {
                    console.error("Cannot send command, not connected.");
                    showToast("Not connected. Could not send drawing.");
                }
            }
            
            function createCommandObject(cmd) {
                if (!cmd || !cmd.tool) return null;
                switch(cmd.tool) {
                    case 'pen':
                    case 'eraser': // Eraser is also a FreehandPath
                        return new FreehandPath(cmd.tool, cmd.points, cmd.color, cmd.lineWidth);
                    case 'rectangle':
                        return new RectangleShape(cmd.x, cmd.y, cmd.width, cmd.height, cmd.color, cmd.lineWidth);
                    case 'circle':
                         return new CircleShape(cmd.x, cmd.y, cmd.radius, cmd.color, cmd.lineWidth);
                    default:
                        console.warn("Received unknown command tool:", cmd.tool);
                        return null;
                }
            }


            // --- DRAWING OBJECTS (MODEL) ---
            
            // FIX #2: The tool is now passed into the constructor
            class FreehandPath {
                constructor(tool, points, color, lineWidth) {
                    this.tool = tool; 
                    this.points = points;
                    this.color = color;
                    this.lineWidth = lineWidth;
                }
                draw(context) {
                    context.strokeStyle = this.color;
                    context.lineWidth = this.lineWidth;
                    context.beginPath();
                    if (this.points.length > 0) {
                        context.moveTo(this.points[0].x, this.points[0].y);
                        this.points.forEach(p => context.lineTo(p.x, p.y));
                    }
                    context.stroke();
                }
                 isHit(x, y) { return false; }
            }

            class RectangleShape {
                constructor(x, y, width, height, color, lineWidth) {
                    this.tool = 'rectangle'; 
                    this.x = x;
                    this.y = y;
                    this.width = width;
                    this.height = height;
                    this.color = color;
                    this.lineWidth = lineWidth;
                }
                draw(context) {
                    context.strokeStyle = this.color;
                    context.lineWidth = this.lineWidth;
                    context.strokeRect(this.x, this.y, this.width, this.height);
                }
                isHit(x, y) {
                    return x >= this.x && x <= this.x + this.width && y >= this.y && y <= this.y + this.height;
                }
            }
            
            class CircleShape {
                constructor(x, y, radius, color, lineWidth) {
                    this.tool = 'circle';
                    this.x = x;
                    this.y = y;
                    this.radius = radius;
                    this.color = color;
                    this.lineWidth = lineWidth;
                }
                draw(context) {
                    context.strokeStyle = this.color;
                    context.lineWidth = this.lineWidth;
                    context.beginPath();
                    context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    context.stroke();
                }
                 isHit(x, y) {
                    const distance = Math.sqrt(Math.pow(x - this.x, 2) + Math.pow(y - this.y, 2));
                    return distance <= this.radius;
                }
            }


            // --- UI EVENT LISTENERS (CONTROLLER) ---
            const toolButtons = document.querySelectorAll('.tool-btn');
            const colorPicker = document.getElementById('color-picker');
            const widthSlider = document.getElementById('width-slider');
            const clearButton = document.getElementById('clear-canvas');

            toolButtons.forEach(button => {
                button.addEventListener('click', () => {
                    toolButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    state.currentTool = button.dataset.tool;
                });
            });

            colorPicker.addEventListener('change', (e) => state.strokeColor = e.target.value);
            widthSlider.addEventListener('input', (e) => state.lineWidth = e.target.value);

            clearButton.addEventListener('click', () => {
                if (confirm('Are you sure you want to clear the entire whiteboard?')) {
                    if (stompClient && stompClient.connected) {
                        stompClient.send(`/app/whiteboard/${sessionId}/clear`, {}, '');
                    }
                }
            });


            // --- CANVAS LOGIC ---
            function setCanvasSize() {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                renderCanvas();
            }

            function renderCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                commandHistory.forEach(command => command.draw(ctx));

                if (state.selectedObject) {
                    ctx.strokeStyle = '#0284c7';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    const obj = state.selectedObject;
                    if (obj.tool === 'rectangle') {
                        ctx.strokeRect(obj.x - 5, obj.y - 5, obj.width + 10, obj.height + 10);
                    } else if (obj.tool === 'circle') {
                        ctx.beginPath();
                        ctx.arc(obj.x, obj.y, obj.radius + 5, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.setLineDash([]);
                }
            }

            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            canvas.addEventListener('mousedown', (e) => {
                const { x, y } = getMousePos(e);
                state.isDrawing = true;
                state.startX = x;
                state.startY = y;
                state.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                if (state.currentTool === 'select') {
                    state.selectedObject = null;
                    for (let i = commandHistory.length - 1; i >= 0; i--) {
                        if (commandHistory[i].isHit(x, y)) {
                            state.selectedObject = commandHistory[i];
                            state.isDragging = true;
                            state.offsetX = x - state.selectedObject.x;
                            state.offsetY = y - state.selectedObject.y;
                            break;
                        }
                    }
                    renderCanvas();
                } 
                // FIX #3: Only create a new path if using pen or eraser
                else if (state.currentTool === 'pen' || state.currentTool === 'eraser') {
                    const color = state.currentTool === 'eraser' ? '#FFFFFF' : state.strokeColor;
                    const newPath = new FreehandPath(state.currentTool, [], color, state.lineWidth);
                    commandHistory.push(newPath);
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!state.isDrawing) return;
                const { x, y } = getMousePos(e);
                
                ctx.putImageData(state.snapshot, 0, 0);

                switch(state.currentTool) {
                    case 'pen':
                    case 'eraser':
                        const currentPath = commandHistory[commandHistory.length - 1];
                        if (currentPath) currentPath.points.push({ x, y });
                        renderCanvas();
                        break;
                    case 'rectangle':
                        const rect = new RectangleShape(state.startX, state.startY, x - state.startX, y - state.startY, state.strokeColor, state.lineWidth);
                        rect.draw(ctx);
                        break;
                    case 'circle':
                        const radius = Math.sqrt(Math.pow(x - state.startX, 2) + Math.pow(y - state.startY, 2));
                        const circle = new CircleShape(state.startX, state.startY, radius, state.strokeColor, state.lineWidth);
                        circle.draw(ctx);
                        break;
                    case 'select':
                        if (state.isDragging && state.selectedObject) {
                            state.selectedObject.x = x - state.offsetX;
                            state.selectedObject.y = y - state.offsetY;
                            renderCanvas();
                        }
                        break;
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                if (!state.isDrawing) return;
                state.isDrawing = false;
                
                const { x, y } = getMousePos(e);
                let command;

                switch (state.currentTool) {
                    case 'pen':
                    case 'eraser':
                        command = commandHistory[commandHistory.length - 1]; // Get the path we were just drawing
                        if (command && command.points.length > 0) {
                             sendCommand(command);
                        } else {
                            commandHistory.pop(); // Remove empty path
                        }
                        break;
                    case 'rectangle':
                        command = new RectangleShape(state.startX, state.startY, x - state.startX, y - state.startY, state.strokeColor, state.lineWidth);
                        commandHistory.push(command);
                        sendCommand(command);
                        break;
                    case 'circle':
                        const radius = Math.sqrt(Math.pow(x - state.startX, 2) + Math.pow(y - state.startY, 2));
                        command = new CircleShape(state.startX, state.startY, radius, state.strokeColor, state.lineWidth);
                        commandHistory.push(command);
                        sendCommand(command);
                        break;
                     case 'select':
                        if (state.isDragging && state.selectedObject) {
                           // Future: send a 'move' command here
                        }
                        state.isDragging = false;
                        break;
                }
                
                renderCanvas();
            });

            // --- INITIALIZATION ---
            window.addEventListener('resize', setCanvasSize);
            setCanvasSize();
            connect();
        });
    </script>
</body>
</html>
